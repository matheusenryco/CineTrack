<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <header>
        <h1>CineTrack</h1>
        <input type="search" aria-label="Buscar filme" placeholder="Buscar filme">
        <button type="button"><span class="btn-curto">+</span><span class="btn-longo">+ Adicionar</span></button>
    </header>

    <nav aria-label="Filtros de status">
        <button type="button" class="ativo" data-status="todos">Todos</button>
        <button type="button" data-status="assistido">Assistido</button>
        <button type="button" data-status="assistindo">Assistindo</button>
        <button type="button" data-status="quero">Quero assistir</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite"></section>
    </main>

    <footer>
        <p><small>CineTrack - UEM</small></p>
        <p><a href="adicionar.html">Adicionar filme</a></p>
        <p><a href="sobre.html">Sobre</a></p>
    </footer>

    <div id="modal" hidden>
        <div class="modal-conteudo">
            <h2>Adicionar filme</h2>
            <form id="form-filme">
                <label for="titulo">Título</label>
                <input id="titulo" type="text" name="titulo" required>

                <label for="ano">Ano</label>
                <input id="ano" type="number" name="ano" min="1888" max="2030" required>

                <label for="genero">Gênero</label>
                <input id="genero" type="text" name="genero" required>

                <label for="url-poster">URL do pôster</label>
                <input id="url-poster" type="text" name="poster">

                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="quero">Quero assistir</option>
                    <option value="assistindo">Assistindo</option>
                    <option value="assistido">Assistido</option>
                </select>

                <label for="nota">Nota (1 a 5)</label>
                <input id="nota" type="number" name="nota" min="1" max="5">

                <label for="comentario">Comentário</label>
                <textarea id="comentario" name="comentario"></textarea>

                <button type="button" id="btn-cancelar">Cancelar</button>
                <button type="submit">Salvar</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
